name: Crawl County Subdivisions

# Overnight lead crawler. Two back-to-back ~4h40m shifts cover 8pm-6am Central
# (CST = UTC-6; during daylight time the window shifts one hour earlier
# on the clock, e.g. 7pm-5am CDT).
#   Shift 1: 02:00 UTC = 8:00pm CST
#   Shift 2: 07:00 UTC = 1:00am CST
# GitHub allows 6h per job, hence two shifts. The concurrency group queues
# them so they never overlap. The dashboard refresh (check_delinquency.yml)
# runs separately at 12:00 UTC = 6:00am CST.

on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Minutes to crawl this run (max ~330)"
        required: false
        default: "280"

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Crawl subdivisions
        run: python subdivision_crawler.py --max-minutes "${{ github.event.inputs.max_minutes || '280' }}"

      - name: Commit new leads and progress
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add input/geo_ids.csv input/subdivision_progress.json
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Auto-crawl: add newly discovered delinquent/current-due properties"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep 10
            done
          fi
